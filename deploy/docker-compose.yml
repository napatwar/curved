# Curved for self-hosting. See docs/self-hosting.md.
#
#   cp .env.example .env    # then fill in the secrets
#   docker compose up -d --build
#
# Every service sits behind Caddy on one origin (ADR 0008). Only Caddy
# publishes ports.

# A different project name from the development docker-compose.yml, so the
# two never share containers or volumes.
name: curved-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# The curved image and rocicorp/zero must stay on matching versions: the image
# contains @rocicorp/zero 1.11.3. Until images are published, the image is
# built from this repository.
x-curved: &curved
  image: curved:local
  build:
    context: ..
  logging: *logging

x-database-url: &database-url postgres://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/curved

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    depends_on:
      curved:
        condition: service_healthy
      zero-cache:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-${CURVED_DOMAIN:?set CURVED_DOMAIN in .env}}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging: *logging

  migrate:
    <<: *curved
    command: ["node", "dist/migrate.js"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: *database-url

  curved:
    <<: *curved
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: *database-url
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional. Listed without a value, so they stay unset unless .env sets them.
      SENTRY_DSN:
      SENTRY_ENVIRONMENT:
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  zero-cache:
    image: rocicorp/zero:1.11.3
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      ZERO_UPSTREAM_DB: *database-url
      ZERO_APP_PUBLICATIONS: zero_curved
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: ${ZERO_ADMIN_PASSWORD:?set ZERO_ADMIN_PASSWORD in .env}
      ZERO_QUERY_URL: http://curved:3000/api/zero/query
      ZERO_MUTATE_URL: http://curved:3000/api/zero/mutate
      # The session cookie reaches the API through zero-cache (ADR 0005).
      ZERO_QUERY_FORWARD_COOKIES: "true"
      ZERO_MUTATE_FORWARD_COOKIES: "true"
      ZERO_NUM_SYNC_WORKERS: ${ZERO_NUM_SYNC_WORKERS:-2}
      ZERO_LOG_FORMAT: json
      # zero-cache sends anonymous usage data to Rocicorp unless this is false.
      ZERO_ENABLE_TELEMETRY: ${ZERO_ENABLE_TELEMETRY:-false}
      # Optional. Sends zero-cache's OpenTelemetry metrics to your collector.
      OTEL_EXPORTER_OTLP_ENDPOINT:
    volumes:
      - zero-data:/data
    mem_limit: ${ZERO_MEMORY_LIMIT:-2g}
    logging: *logging
    # The first start copies the replica from Postgres.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4848/keepalive"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 120s

  postgres:
    image: postgres:18
    restart: unless-stopped
    # Zero needs logical replication. max_slot_wal_keep_size stops a stopped
    # zero-cache from filling the disk with WAL: Postgres drops its slot at the
    # limit, and zero-cache rebuilds its replica when it starts.
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_slot_wal_keep_size=${POSTGRES_MAX_SLOT_WAL_KEEP_SIZE:-10GB}
    environment:
      POSTGRES_DB: curved
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 128mb
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curved"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Writes a pg_dump of the database to ./backups every day at BACKUP_TIME
  # and deletes dumps older than BACKUP_KEEP_DAYS. Same image as postgres, so
  # pg_dump always matches the server.
  backup:
    image: postgres:18
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: postgres
      PGDATABASE: curved
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      TZ: ${TZ:-UTC}
    volumes:
      - ./backups:/backups
    logging: *logging
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        umask 077
        # bash as PID 1 ignores SIGTERM, so stop on it explicitly. Sleeping in
        # the background lets the trap run without waiting for sleep to end.
        trap 'exit 0' TERM INT
        echo "backup: daily at $$BACKUP_TIME $$TZ, keeping $$BACKUP_KEEP_DAYS days"
        while true; do
          next=$$(date -d "today $$BACKUP_TIME" +%s)
          [ "$$next" -gt "$$(date +%s)" ] || next=$$(date -d "tomorrow $$BACKUP_TIME" +%s)
          sleep $$(( next - $$(date +%s) )) &
          wait $$!
          file="/backups/curved-$$(date +%Y%m%d-%H%M%S).dump"
          if pg_dump -Fc -f "$$file.partial"; then
            mv "$$file.partial" "$$file"
            echo "backup: wrote $$file"
            find /backups -name 'curved-*.dump' -mtime +$$(( BACKUP_KEEP_DAYS - 1 )) -print -delete
          else
            rm -f "$$file.partial"
            echo "backup: pg_dump failed" >&2
          fi
        done

volumes:
  postgres-data:
  zero-data:
  caddy-data:
  caddy-config:
