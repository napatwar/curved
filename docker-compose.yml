name: curved

# Local development only. These credentials must not be used in production.
services:
  postgres:
    image: postgres:18
    command: postgres -c wal_level=logical
    environment:
      POSTGRES_DB: curved
      POSTGRES_PASSWORD: pass
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d curved"]
      interval: 2s
      timeout: 3s
      retries: 30

  zero-cache:
    # Keep this version equal to @rocicorp/zero in package.json files.
    image: rocicorp/zero:1.11.3
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZERO_UPSTREAM_DB: postgres://postgres:pass@postgres:5432/curved
      ZERO_APP_PUBLICATIONS: zero_curved
      ZERO_REPLICA_FILE: /data/replica.db
      ZERO_ADMIN_PASSWORD: dev-only
      # The API runs on the host during development.
      ZERO_QUERY_URL: http://host.docker.internal:3000/api/zero/query
      ZERO_MUTATE_URL: http://host.docker.internal:3000/api/zero/mutate
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4848:4848"
    volumes:
      - zero-data:/data
    # The first start copies the replica and can take tens of seconds.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:4848/keepalive"]
      interval: 2s
      timeout: 3s
      retries: 60
      start_period: 60s

volumes:
  postgres-data:
  zero-data:
